name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          node --check lib/index.js
          node --check lib/client.js
      - name: Host command tests
        run: node --test test/host.test.mjs
      - name: Client bundle smoke test
        run: |
          npm install --no-save --no-package-lock react@18 react-dom@18
          node test/client.smoke.mjs